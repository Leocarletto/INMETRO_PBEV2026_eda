<div id="ciclo-carbono">
<style>
  #ciclo-carbono{
    --sky-top:#06223a; --sky-mid:#123a55; --sky-horizon:#e9a767;
    --photo:#5fdc92; --combust:#ff6a3c; --resp:#f6c65f; --ocean-x:#56c8e8; --bury:#aeb8c4;
    --ink:#eaf1f6; --muted:#9fb3c4;
    margin:0; line-height:0;            /* line-height:0 elimina qualquer folga embaixo */
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  #ciclo-carbono svg{display:block; width:100%; height:auto}

  #ciclo-carbono .cloud{animation:cc-drift 60s linear infinite}
  #ciclo-carbono .cloud.b{animation-duration:90s; animation-direction:reverse}
  #ciclo-carbono .cloud.c{animation-duration:75s}
  @keyframes cc-drift{from{transform:translateX(-40px)}to{transform:translateX(60px)}}
  #ciclo-carbono .sun{transform-origin:850px 92px; animation:cc-pulse 6s ease-in-out infinite}
  @keyframes cc-pulse{0%,100%{opacity:.9}50%{opacity:1}}
  #ciclo-carbono .waves{animation:cc-sway 9s ease-in-out infinite}
  @keyframes cc-sway{0%,100%{transform:translateX(0)}50%{transform:translateX(-14px)}}
  #ciclo-carbono .co2{animation:cc-floatup 18s ease-in-out infinite}
  #ciclo-carbono .co2.b{animation-duration:22s; animation-delay:-6s}
  #ciclo-carbono .co2.c{animation-duration:26s; animation-delay:-12s}
  @keyframes cc-floatup{0%,100%{transform:translateY(0); opacity:.45}50%{transform:translateY(-10px); opacity:.7}}

  @media (prefers-reduced-motion: reduce){
    #ciclo-carbono .cloud,#ciclo-carbono .sun,#ciclo-carbono .waves,#ciclo-carbono .co2{animation:none !important}
  }
</style>

<svg id="cc-scene" viewBox="0 0 1000 660" role="img"
     aria-label="Animação do ciclo do carbono: fotossíntese, respiração e decomposição, combustão de veículos e indústria, trocas com o oceano e soterramento.">
  <defs>
    <linearGradient id="cc-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="var(--sky-top)"/>
      <stop offset="62%" stop-color="var(--sky-mid)"/>
      <stop offset="100%" stop-color="var(--sky-horizon)"/>
    </linearGradient>
    <radialGradient id="cc-sunG" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff3d6"/>
      <stop offset="45%" stop-color="#ffd27a"/>
      <stop offset="100%" stop-color="#ffae53" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cc-oceanG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1d6c8e"/>
      <stop offset="100%" stop-color="#06354c"/>
    </linearGradient>
    <linearGradient id="cc-soilG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6a4630"/>
      <stop offset="100%" stop-color="#3f2a1c"/>
    </linearGradient>
    <linearGradient id="cc-canopyG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4fb878"/>
      <stop offset="100%" stop-color="#1f6d44"/>
    </linearGradient>
    <filter id="cc-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- SKY -->
  <rect x="0" y="0" width="1000" height="380" fill="url(#cc-sky)"/>
  <circle class="sun" cx="850" cy="92" r="120" fill="url(#cc-sunG)"/>
  <circle class="sun" cx="850" cy="92" r="40" fill="#fff0cf"/>

  <!-- clouds -->
  <g fill="#ffffff" opacity="0.85">
    <g class="cloud">
      <ellipse cx="180" cy="80" rx="46" ry="20"/><ellipse cx="222" cy="72" rx="34" ry="22"/><ellipse cx="138" cy="86" rx="30" ry="16"/>
    </g>
    <g class="cloud b" opacity="0.7">
      <ellipse cx="560" cy="60" rx="40" ry="17"/><ellipse cx="596" cy="54" rx="28" ry="18"/><ellipse cx="526" cy="66" rx="26" ry="14"/>
    </g>
    <g class="cloud c" opacity="0.6">
      <ellipse cx="690" cy="150" rx="34" ry="14"/><ellipse cx="720" cy="144" rx="24" ry="15"/>
    </g>
  </g>

  <!-- drifting CO2 labels -->
  <g font-size="15" font-weight="700" fill="#dff0ff" opacity="0.5">
    <text class="co2"   x="470" y="120">CO₂</text>
    <text class="co2 b" x="300" y="180">CO₂</text>
    <text class="co2 c" x="760" y="100">CO₂</text>
  </g>

  <!-- OCEAN -->
  <rect x="0" y="380" width="232" height="280" fill="url(#cc-oceanG)"/>
  <g class="waves" stroke="#bfeaf6" stroke-width="2.5" fill="none" opacity="0.55" stroke-linecap="round">
    <path d="M-10 404 q22 -10 44 0 t44 0 t44 0 t44 0 t44 0 t44 0"/>
    <path d="M-10 430 q22 -10 44 0 t44 0 t44 0 t44 0 t44 0 t44 0" opacity="0.6"/>
  </g>

  <!-- UNDERGROUND (land) -->
  <rect x="232" y="380" width="768" height="280" fill="url(#cc-soilG)"/>
  <rect x="232" y="566" width="768" height="94" fill="#241a12"/>
  <g opacity="0.9">
    <ellipse cx="470" cy="606" rx="16" ry="9" fill="#0e0a07"/>
    <ellipse cx="520" cy="624" rx="12" ry="7" fill="#0e0a07"/>
    <rect x="612" y="598" width="26" height="18" rx="4" fill="#0a0a0a"/>
    <rect x="648" y="616" width="20" height="14" rx="3" fill="#0a0a0a"/>
    <ellipse cx="780" cy="610" rx="18" ry="10" fill="#0e0a07"/>
    <rect x="840" y="600" width="24" height="16" rx="4" fill="#0a0a0a"/>
  </g>
  <g stroke="#7a5235" stroke-width="3" fill="none" opacity="0.7" stroke-linecap="round">
    <path d="M360 384 v40 m0 -22 l-22 26 m22 -10 l24 24"/>
    <path d="M300 384 v34 m0 -18 l-18 20"/>
  </g>

  <rect x="232" y="378" width="768" height="6" fill="#7c5a3c"/>

  <!-- FOREST -->
  <g>
    <rect x="252" y="350" width="9" height="34" fill="#6b4a2e"/>
    <ellipse cx="256" cy="332" rx="30" ry="28" fill="url(#cc-canopyG)"/>
    <rect x="356" y="338" width="11" height="46" fill="#6b4a2e"/>
    <ellipse cx="361" cy="304" rx="44" ry="40" fill="url(#cc-canopyG)"/>
    <ellipse cx="338" cy="318" rx="26" ry="24" fill="#3f9d63"/>
    <ellipse cx="386" cy="320" rx="24" ry="22" fill="#3f9d63"/>
    <rect x="424" y="352" width="8" height="32" fill="#6b4a2e"/>
    <ellipse cx="428" cy="336" rx="26" ry="24" fill="url(#cc-canopyG)"/>
  </g>

  <!-- ROAD + CAR -->
  <rect x="470" y="378" width="530" height="10" fill="#2b2f36"/>
  <g stroke="#f2c94c" stroke-width="3" stroke-dasharray="16 14" opacity="0.8">
    <line x1="476" y1="383" x2="996" y2="383"/>
  </g>
  <g>
    <circle cx="640" cy="372" r="7" fill="#9aa6b2" opacity="0.5"/>
    <circle cx="630" cy="366" r="5" fill="#9aa6b2" opacity="0.35"/>
    <rect x="648" y="352" width="78" height="20" rx="7" fill="#d8463f"/>
    <path d="M662 352 q10 -16 26 -16 h16 q14 0 22 16 z" fill="#e2655f"/>
    <rect x="675" y="343" width="34" height="11" rx="3" fill="#bfe0ef" opacity="0.85"/>
    <circle cx="668" cy="374" r="9" fill="#1c1f24"/><circle cx="668" cy="374" r="4" fill="#566"/>
    <circle cx="712" cy="374" r="9" fill="#1c1f24"/><circle cx="712" cy="374" r="4" fill="#566"/>
  </g>

  <!-- FACTORY -->
  <g>
    <rect x="770" y="314" width="120" height="64" fill="#48525c"/>
    <rect x="788" y="280" width="18" height="40" fill="#5a646e"/>
    <rect x="846" y="288" width="18" height="32" fill="#5a646e"/>
    <rect x="782" y="328" width="14" height="14" fill="#2c333a"/>
    <rect x="806" y="328" width="14" height="14" fill="#2c333a"/>
    <rect x="838" y="328" width="14" height="14" fill="#2c333a"/>
    <rect x="862" y="328" width="14" height="14" fill="#2c333a"/>
  </g>

  <!-- GUIDE PATHS -->
  <g fill="none" stroke-width="2.2" opacity="0.22" stroke-linecap="round">
    <path id="cc-flow-photo"        d="M360 145 C 360 215, 352 260, 360 300" stroke="var(--photo)"/>
    <path id="cc-flow-presp"        d="M326 300 C 312 245, 304 200, 300 150" stroke="var(--resp)"/>
    <path id="cc-flow-combust-car"  d="M640 372 C 648 300, 686 205, 700 118" stroke="var(--combust)"/>
    <path id="cc-flow-combust-fac"  d="M797 280 C 800 230, 818 172, 828 118" stroke="var(--combust)"/>
    <path id="cc-flow-decomp"       d="M430 520 C 440 420, 448 280, 452 160" stroke="var(--resp)"/>
    <path id="cc-flow-ocean-down"   d="M118 158 C 108 240, 114 320, 118 384" stroke="var(--ocean-x)"/>
    <path id="cc-flow-ocean-up"     d="M150 384 C 156 316, 150 236, 144 158" stroke="var(--ocean-x)"/>
    <path id="cc-flow-bury"         d="M386 392 C 426 460, 502 535, 560 600" stroke="var(--bury)"/>
  </g>

  <!-- PARTICLE LAYER -->
  <g id="cc-particles" filter="url(#cc-glow)"></g>

  <!-- FLOW LABELS -->
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"
     font-size="12.5" font-weight="700">
    <rect x="372" y="208" width="118" height="22" rx="11" fill="rgba(7,18,30,.85)" stroke="var(--photo)" stroke-opacity=".6"/>
    <circle cx="385" cy="219" r="4" fill="var(--photo)"/>
    <text x="396" y="223" fill="#fff">Fotossíntese</text>

    <rect x="150" y="196" width="104" height="22" rx="11" fill="rgba(7,18,30,.85)" stroke="var(--resp)" stroke-opacity=".6"/>
    <circle cx="163" cy="207" r="4" fill="var(--resp)"/>
    <text x="174" y="211" fill="#fff">Respiração</text>

    <rect x="708" y="244" width="178" height="22" rx="11" fill="rgba(7,18,30,.85)" stroke="var(--combust)" stroke-opacity=".6"/>
    <circle cx="721" cy="255" r="4" fill="var(--combust)"/>
    <text x="732" y="259" fill="#fff">Combustão · veículos</text>

    <rect x="808" y="198" width="184" height="22" rx="11" fill="rgba(7,18,30,.85)" stroke="var(--combust)" stroke-opacity=".6"/>
    <circle cx="821" cy="209" r="4" fill="var(--combust)"/>
    <text x="832" y="213" fill="#fff">Combustão · indústria</text>

    <rect x="462" y="300" width="122" height="22" rx="11" fill="rgba(7,18,30,.85)" stroke="var(--resp)" stroke-opacity=".6"/>
    <circle cx="475" cy="311" r="4" fill="var(--resp)"/>
    <text x="486" y="315" fill="#fff">Decomposição</text>

    <rect x="20" y="300" width="150" height="22" rx="11" fill="rgba(7,18,30,.85)" stroke="var(--ocean-x)" stroke-opacity=".6"/>
    <circle cx="33" cy="311" r="4" fill="var(--ocean-x)"/>
    <text x="44" y="315" fill="#fff">Trocas oceânicas</text>

    <rect x="470" y="486" width="124" height="22" rx="11" fill="rgba(7,18,30,.85)" stroke="var(--bury)" stroke-opacity=".6"/>
    <circle cx="483" cy="497" r="4" fill="var(--bury)"/>
    <text x="494" y="501" fill="#fff">Soterramento</text>
  </g>

  <!-- RESERVOIR LABELS -->
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"
     font-size="12" font-weight="800" letter-spacing="0.12em">
    <rect x="28"  y="20"  width="104" height="24" rx="6" fill="rgba(7,18,30,.8)" stroke="rgba(255,255,255,.2)"/>
    <text x="42"  y="36"  fill="#eaf1f6">ATMOSFERA</text>
    <rect x="24"  y="536" width="80"  height="24" rx="6" fill="rgba(7,18,30,.55)" stroke="rgba(255,255,255,.2)"/>
    <text x="38"  y="552" fill="#dff3fb">OCEANO</text>
    <rect x="312" y="352" width="96"  height="24" rx="6" fill="rgba(7,18,30,.8)" stroke="rgba(255,255,255,.2)"/>
    <text x="326" y="368" fill="#d8f5e3">FLORESTA</text>
    <rect x="486" y="452" width="60"  height="24" rx="6" fill="rgba(7,18,30,.55)" stroke="rgba(255,255,255,.2)"/>
    <text x="500" y="468" fill="#f1e2d2">SOLO</text>
    <rect x="624" y="632" width="196" height="24" rx="6" fill="rgba(7,18,30,.7)" stroke="rgba(255,255,255,.2)"/>
    <text x="638" y="648" fill="#e7edf3">COMBUSTÍVEIS FÓSSEIS</text>
  </g>
</svg>
</div>

<script>
(function(){
  const NS='http://www.w3.org/2000/svg', XL='http://www.w3.org/1999/xlink';
  const layer=document.getElementById('cc-particles');
  if(!layer) return;
  const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const flows=[
    {p:'cc-flow-photo',       c:'var(--photo)',   n:5, d:6.0, r:3.4},
    {p:'cc-flow-presp',       c:'var(--resp)',    n:3, d:7.0, r:2.6},
    {p:'cc-flow-combust-car', c:'var(--combust)', n:6, d:5.0, r:3.6},
    {p:'cc-flow-combust-fac', c:'var(--combust)', n:5, d:5.5, r:3.4},
    {p:'cc-flow-decomp',      c:'var(--resp)',    n:4, d:8.0, r:2.8},
    {p:'cc-flow-ocean-down',  c:'var(--ocean-x)', n:3, d:7.0, r:3.0},
    {p:'cc-flow-ocean-up',    c:'var(--ocean-x)', n:3, d:7.5, r:3.0},
    {p:'cc-flow-bury',        c:'var(--bury)',    n:3, d:14.0,r:2.6}
  ];
  flows.forEach(function(f){
    const path=document.getElementById(f.p);
    const len=path.getTotalLength();
    for(let i=0;i<f.n;i++){
      const dot=document.createElementNS(NS,'circle');
      dot.setAttribute('r',f.r); dot.setAttribute('fill',f.c);
      if(reduce){
        const pt=path.getPointAtLength(len*(i+0.5)/f.n);
        dot.setAttribute('cx',pt.x.toFixed(1)); dot.setAttribute('cy',pt.y.toFixed(1));
        layer.appendChild(dot);
      } else {
        const am=document.createElementNS(NS,'animateMotion');
        am.setAttribute('dur',f.d+'s'); am.setAttribute('repeatCount','indefinite');
        am.setAttribute('begin',(-(f.d*i/f.n)).toFixed(2)+'s'); am.setAttribute('calcMode','linear');
        const mp=document.createElementNS(NS,'mpath');
        mp.setAttribute('href','#'+f.p); mp.setAttributeNS(XL,'xlink:href','#'+f.p);
        am.appendChild(mp); dot.appendChild(am); layer.appendChild(dot);
      }
    }
  });
})();
</script>
