project:
  type: default

author: "Leonardo Carletto"

# Cada documento define o seu próprio formato:
#   relatorio.qmd    -> html (arquivo único, self-contained)
#   apresentacao.qmd -> revealjs
# Por isso não há um "format" global aqui (evita renderizar a
# apresentação como html por engano).

execute:
  echo: false
  warning: false
  message: false
  freeze: auto